name: Publish Backend Docker Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git branch or tag to build
        required: true
        default: 'v1.1.0-rc1'
      image_tag:
        description: Docker image tag to publish
        required: true
        default: 'v1.1.0-rc1'

  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/szero-white/dms-lite-backend:${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || github.ref_name }}
