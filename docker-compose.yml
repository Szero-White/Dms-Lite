services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dms_lite
      POSTGRES_USER: dms
      POSTGRES_PASSWORD: dms
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dms -d dms_lite"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${SPRING_RABBITMQ_USERNAME:-dms}
      RABBITMQ_DEFAULT_PASS: ${SPRING_RABBITMQ_PASSWORD:-dms-local-only}
    ports: ["127.0.0.1:5672:5672", "127.0.0.1:15672:15672"]
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/dms_lite
      SPRING_DATASOURCE_USERNAME: dms
      SPRING_DATASOURCE_PASSWORD: dms
      SPRING_REDIS_HOST: redis
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${SPRING_RABBITMQ_USERNAME:-dms}
      SPRING_RABBITMQ_PASSWORD: ${SPRING_RABBITMQ_PASSWORD:-dms-local-only}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      SPRING_PROFILES_ACTIVE: docker
      APP_DEMO_ENABLED: ${APP_DEMO_ENABLED:-false}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      rabbitmq: { condition: service_started }
    ports: ["8080:8080"]
  frontend:
    build:
      context: ./frontend
      dockerfile: deploy/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
        VITE_DEMO_PASSWORD: ${VITE_DEMO_PASSWORD:-Demo@2026}
    depends_on: [backend]
    ports: ["3000:80"]
  prometheus:
    image: prom/prometheus
    volumes: ["./docs/prometheus.yml:/etc/prometheus/prometheus.yml"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-change-me}
    ports: ["127.0.0.1:3001:3000"]
volumes:
  postgres_data:
